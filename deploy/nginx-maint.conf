# Drop-in nginx location block for maint-rust.
# Place inside an existing `server { ... }` that already terminates TLS.
# This matches §14.3 of the architecture document exactly, with a couple of
# additions for request-body size limits (chassis full + bulk responses can be ~1 MB).

location /api/maint/ {
    proxy_pass         http://127.0.0.1:8090/api/maint/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    # Tunables for sync push payloads (§7.2 sends batches of 50 ops).
    client_max_body_size 4m;
}
