name: Build and Deploy Rust App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test (unit + vocabulary pins; live tests skip without a DB)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --locked

      - name: Build in Docker (Ubuntu 22.04 - matches VPS)
        env:
          SQLX_OFFLINE: true
        run: |
          cat > Dockerfile.build << 'EOF'
          FROM ubuntu:22.04

          ENV DEBIAN_FRONTEND=noninteractive

          # libssl-dev is still required by sqlx and other crates at compile time
          RUN apt-get update && apt-get install -y \
              curl \
              build-essential \
              pkg-config \
              libssl-dev \
              ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          RUN curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          ENV PATH="/root/.cargo/bin:${PATH}"

          WORKDIR /app

          COPY . .

          # --locked: build the exact deps in the committed Cargo.lock. Without
          # it a semver-compatible upstream release could silently change a
          # production deploy with no code change.
          # x86-64-v4 (AVX-512): the VPS is an AMD EPYC 9354P (checked 2026-10-25,
          # `ld.so --help` lists v4 as supported). The explicit --target keeps the
          # flag off build scripts and proc macros, which run on the CI machine.
          ENV RUSTFLAGS="-C target-cpu=x86-64-v4"
          RUN cargo build --release --target x86_64-unknown-linux-gnu --locked --verbose

          RUN strip target/x86_64-unknown-linux-gnu/release/maint-rust || true

          RUN ls -lh target/x86_64-unknown-linux-gnu/release/maint-rust
          EOF

          docker build -t maint-rust-builder -f Dockerfile.build .

          docker create --name temp-container maint-rust-builder
          docker cp temp-container:/app/target/x86_64-unknown-linux-gnu/release/maint-rust ./maint-rust
          docker rm temp-container

          ls -la maint-rust
          file maint-rust

          chmod +x maint-rust

      - name: Prepare deployment package
        run: |
          mkdir -p deployment

          cp maint-rust deployment/
          cp -r migrations deployment/ || true
          mkdir -p deployment/scripts
          cp scripts/reset_legacy_schema.sql deployment/scripts/
          cp .env.example deployment/.env.example || true

          tar -czf deployment.tar.gz -C deployment .

          echo "Deployment package contents:"
          tar -tzf deployment.tar.gz

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e

          DEPLOY_DIR="/opt/maint-rust"
          SERVICE_NAME="maint-rust"
          BACKUP_DIR="/opt/maint-rust/backups"

          echo "Starting deployment..."

          sudo mkdir -p ${DEPLOY_DIR}
          sudo mkdir -p ${BACKUP_DIR}
          sudo mkdir -p ${DEPLOY_DIR}/logs

          echo "Stopping service..."
          sudo systemctl stop ${SERVICE_NAME} || true

          # Free the port the service binds. systemctl only stops the process
          # IT owns — an orphaned maint-rust started outside systemd (e.g. a
          # manual `nohup`/`screen` run) keeps holding the port, so every deploy
          # dies with "Address already in use (os error 98)" and the box keeps
          # serving stale code forever. Kill whatever still holds the port.
          PORT_PID=$(sudo ss -lptnH "sport = :8095" 2>/dev/null | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2 || true)
          if [ -n "$PORT_PID" ]; then
            echo "Port 8095 still held by PID $PORT_PID after stop — freeing it..."
            sudo kill "$PORT_PID" 2>/dev/null || true
            sleep 2
            sudo kill -9 "$PORT_PID" 2>/dev/null || true
            sleep 1
          fi

          if [ -f ${DEPLOY_DIR}/maint-rust ]; then
            echo "Backing up existing binary..."
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            sudo cp ${DEPLOY_DIR}/maint-rust ${BACKUP_DIR}/maint-rust.${TIMESTAMP}
            sudo ls -t ${BACKUP_DIR}/maint-rust.* | tail -n +6 | xargs -r sudo rm
          fi

          echo "Extracting new files..."
          cd ${DEPLOY_DIR}
          sudo tar -xzf /tmp/deployment.tar.gz

          echo "Files in deployment directory:"
          ls -la ${DEPLOY_DIR}/

          sudo chmod +x ${DEPLOY_DIR}/maint-rust
          sudo chown -R root:root ${DEPLOY_DIR}

          # Nightly Postgres backup — this DB is the sole home of all
          # maintenance truth; the binary backup above never covered it.
          sudo tee /etc/cron.daily/maint-pg-backup > /dev/null << 'CRON'
          #!/bin/bash
          set -e
          BACKUP_DIR=/opt/maint-rust/backups/pg
          mkdir -p "$BACKUP_DIR"
          STAMP=$(date +%Y%m%d)
          # DATABASE_URL from the service env file
          source /opt/maint-rust/.env
          pg_dump "$DATABASE_URL" | gzip > "$BACKUP_DIR/apex_maint_$STAMP.sql.gz"
          # keep 14 days
          ls -t "$BACKUP_DIR"/apex_maint_*.sql.gz | tail -n +15 | xargs -r rm
          CRON
          sudo chmod +x /etc/cron.daily/maint-pg-backup

          if [ ! -f ${DEPLOY_DIR}/.env ] && [ -f ${DEPLOY_DIR}/.env.example ]; then
            echo "Creating .env from .env.example..."
            sudo cp ${DEPLOY_DIR}/.env.example ${DEPLOY_DIR}/.env
            echo "⚠️  Please configure ${DEPLOY_DIR}/.env with your settings"
          fi

          if [ -d ${DEPLOY_DIR}/migrations ]; then
            echo "Migrations directory found. Run manually if needed:"
            echo "cd ${DEPLOY_DIR} && sqlx migrate run"
          fi

          # Pre-migration Postgres snapshot. The service runs sqlx migrations on
          # boot (main.rs), so the restart below is the moment schema changes
          # apply. Dump NOW — the nightly cron could be up to 24h stale, and a
          # bad migration is exactly when the freshest possible backup matters.
          if [ -f ${DEPLOY_DIR}/.env ]; then
            echo "Pre-deploy Postgres snapshot..."
            PG_BACKUP_DIR=${BACKUP_DIR}/pg
            sudo mkdir -p ${PG_BACKUP_DIR}
            STAMP=$(date +%Y%m%d_%H%M%S)
            # shellcheck disable=SC1091
            DB_URL=$(sudo bash -c "source ${DEPLOY_DIR}/.env && printf %s \"\$DATABASE_URL\"")
            if [ -n "$DB_URL" ]; then
              sudo bash -c "pg_dump '$DB_URL' | gzip > ${PG_BACKUP_DIR}/pre_deploy_${STAMP}.sql.gz" \
                && echo "  snapshot: ${PG_BACKUP_DIR}/pre_deploy_${STAMP}.sql.gz" \
                || echo "  ⚠️ pre-deploy pg_dump failed — continuing (service still has old binary)"
              sudo bash -c "ls -t ${PG_BACKUP_DIR}/pre_deploy_*.sql.gz | tail -n +15 | xargs -r rm"
            else
              echo "  ⚠️ DATABASE_URL not found in .env — skipping snapshot"
            fi
          fi

          # One-time: the 2026-07-20 rebuild rewrote migrations 0003+ in place,
          # so a DB still on the old (May) schema can never boot this binary.
          # The owner chose to discard that data. Keep a dump that the
          # pre_deploy rotation never deletes, then drop the old objects and
          # let the migrations build the new schema on boot. The SQL guards
          # itself too, so this is a no-op once the box is on the new schema.
          if [ -n "${DB_URL:-}" ]; then
            LEGACY=$(sudo bash -c "psql '$DB_URL' -tAc \"SELECT 1 FROM _sqlx_migrations WHERE version = 3 AND description = 'maintenance tables'\"" 2>/dev/null || true)
            if [ "$LEGACY" = "1" ]; then
              echo "Legacy (pre-rebuild) schema found — backing it up and resetting..."
              LEGACY_DUMP=${BACKUP_DIR}/pg/legacy_schema_before_rebuild_$(date +%Y%m%d_%H%M%S).sql.gz
              sudo bash -c "set -o pipefail; pg_dump '$DB_URL' | gzip > ${LEGACY_DUMP}"
              echo "  legacy backup: ${LEGACY_DUMP}"
              sudo bash -c "psql '$DB_URL' -v ON_ERROR_STOP=1 --single-transaction -f ${DEPLOY_DIR}/scripts/reset_legacy_schema.sql"
            fi
          fi

          # nginx used to proxy /api/maint/ to :8090; the service now binds
          # :8095 (an orphan held 8090). Repoint any such proxy_pass.
          NGINX_FILES=$(sudo grep -rlE 'proxy_pass\s+http://127\.0\.0\.1:8090/api/maint' /etc/nginx/ 2>/dev/null || true)
          if [ -n "$NGINX_FILES" ]; then
            for f in $NGINX_FILES; do
              echo "Repointing /api/maint/ proxy to :8095 in $f"
              sudo cp "$f" "${f}.bak.$(date +%Y%m%d_%H%M%S)"
              sudo sed -i -E 's#(proxy_pass\s+http://127\.0\.0\.1:)8090(/api/maint)#\18095\2#' "$f"
            done
            sudo nginx -t && sudo systemctl reload nginx
          fi
          echo "nginx routes for /api/maint/:"
          sudo grep -rn -A2 'location /api/maint' /etc/nginx/ 2>/dev/null || echo "  ⚠️ no 'location /api/maint' block found in /etc/nginx"

          echo "Restarting service..."
          sudo systemctl daemon-reload
          sudo systemctl enable ${SERVICE_NAME}
          sudo systemctl restart ${SERVICE_NAME}

          sleep 3

          echo "Checking service status..."
          if sudo systemctl is-active --quiet ${SERVICE_NAME}; then
            echo "✅ Service is running"
            sudo systemctl status ${SERVICE_NAME} --no-pager
          else
            echo "❌ Service failed to start — rolling back to the previous binary"
            echo "Last 20 log lines:"
            sudo journalctl -u ${SERVICE_NAME} -n 20 --no-pager
            # Preserve the just-deployed (new) binary before we overwrite it —
            # binary rollback is only safe if the schema DIDN'T move forward.
            # Once migrations have applied, an older binary fails to start
            # ("migration N was previously applied but has been modified" /
            # missing migration), so a naive rollback strands the box on an
            # un-startable OLD binary. Try the rollback, but if it also fails,
            # put the NEW binary back so the box is left in a forward-fixable
            # state (schema-current binary on disk) rather than a dead one.
            sudo cp ${DEPLOY_DIR}/maint-rust ${DEPLOY_DIR}/maint-rust.new-failed || true
            LAST_BACKUP=$(sudo bash -c "ls -t ${BACKUP_DIR}/maint-rust.* 2>/dev/null | head -n 1")
            if [ -n "$LAST_BACKUP" ]; then
              echo "Restoring ${LAST_BACKUP}..."
              sudo cp "$LAST_BACKUP" ${DEPLOY_DIR}/maint-rust
              sudo chmod +x ${DEPLOY_DIR}/maint-rust
              sudo systemctl restart ${SERVICE_NAME} || true
              sleep 3
              if sudo systemctl is-active --quiet ${SERVICE_NAME}; then
                echo "↩️  Rolled back to the previous binary; service is running the OLD version."
                echo "   (A schema migration may already have applied — check the pre_deploy snapshot.)"
              else
                echo "❌ Rollback also failed to start (likely schema moved forward)."
                echo "   Restoring the new (schema-current) binary so the box is forward-fixable."
                sudo cp ${DEPLOY_DIR}/maint-rust.new-failed ${DEPLOY_DIR}/maint-rust || true
                sudo chmod +x ${DEPLOY_DIR}/maint-rust
                sudo systemctl restart ${SERVICE_NAME} || true
                sleep 3
                sudo systemctl is-active --quiet ${SERVICE_NAME} \
                  && echo "✅ New binary is now running after all." \
                  || echo "❌ Still down — needs a human. pre_deploy snapshot is safe."
              fi
            else
              echo "No previous binary to roll back to."
            fi
            exit 1
          fi

          echo "Deployment completed successfully!"
          EOF

          chmod +x deploy.sh

          echo "Uploading deployment package..."
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} deployment.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

          echo "Deploying on VPS..."
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/
          ssh -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash /tmp/deploy.sh"

      - name: Health check
        run: |
          echo "Waiting for service to be ready..."
          sleep 5

          # Service is HTTP-only on loopback — no TLS, no -k flag needed
          ssh -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "curl -fsS http://127.0.0.1:8095/api/maint/health"

          # And through nginx, the way the app reaches it. A 404 here is what
          # left the app logged in with no data for months.
          curl -fsS https://apextransport.ddns.net/api/maint/health

      - name: Verify deployment
        run: |
          echo "Verifying service status..."
          ssh -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "systemctl status maint-rust --no-pager" || true

      - name: Show recent logs
        if: always()
        run: |
          echo "Recent service logs:"
          ssh -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo journalctl -u maint-rust -n 30 --no-pager" || true

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "Cleaned up SSH keys"
